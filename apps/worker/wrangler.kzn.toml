name = "line-harness-kzn"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# nodejs_compat is required by @line-harness/update-engine (node:stream/zlib/crypto + tar-stream).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# きずな証人代行（kzn）用テナント — bkobu アカウント（bkobu.yd@gmail.com）
# Account: 01547b03881149dd0db10da0da6928c8
# 設計: C:\dev\kizuna-shonin\docs\line-harness-kzn-design.md
#
# デプロイ（必ずこの順）:
#   node ../../scripts/check-kzn-target.mjs          # 取り違え防止の事前検査（失敗なら中止）
#   pnpm --filter @line-crm/line-sdk build            # 送信禁止ガード入りの dist を作る
#   npx wrangler deploy -c wrangler.kzn.toml          # 要 bkobu の CF トークン
#
# ※ sbo(セールスキャスト本番) の wrangler.toml・fzk の wrangler.fzk.toml とは完全分離。触れない。
# ※ 管理画面・LIFF を配信しないので [assets] は置かない（notFound は JSON 404）。
# ※ 公開配信用の R2(IMAGES) はバインドしない（INCOMING_IMAGE_STORE="0"）。受信メディアは LINE_MEDIA（きずなの非公開
#    バケット kizuna-shonin-uploads・line-media/ 配下）に保全し、きずな管理画面（ログイン必須）からだけ見る。
# ※ 本家 v0.24 の Durable Object 定期実行（TENANT_SCHEDULER）は使わない（バインディング省略時は何もしない
#    設計）。定期処理は下の Cron Trigger だけで回す（本家は "* * * * *" だが kzn は予約/ウェビナー未使用のため
#    5分おきで足りる・無料枠の CPU/リクエストを節約）。DO を足す時は [[durable_objects.bindings]] と
#    [[migrations]] new_sqlite_classes=["TenantScheduler"] を本家 wrangler.toml どおりに追加する。
# ※ ベース: craval-v0.24（本家 5386460 = v0.24.1 + #350）。
# ═══════════════════════════════════════════════════════════════
account_id = "01547b03881149dd0db10da0da6928c8"

[[d1_databases]]
binding = "DB"
database_name = "line-harness-kzn"
database_id = "d13fdca6-6e95-4084-8a34-b3709a0a92f7"

# [Craval kzn] 受信メディアの非公開保全（LINE_MEDIA_STORE="1"）。公開 URL は作らない。事前に D1 へ K003 を適用すること。
[[r2_buckets]]
binding = "LINE_MEDIA"
bucket_name = "kizuna-shonin-uploads"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# 環境変数 (Secrets は `wrangler secret put <NAME> -c wrangler.kzn.toml` で設定)
# ═══════════════════════════════════════════════════════════════
[vars]
WORKER_NAME = "line-harness-kzn"
ADMIN_PAGES_PROJECT = ""
LIFF_PAGES_PROJECT = ""
D1_DATABASE_ID = "d13fdca6-6e95-4084-8a34-b3709a0a92f7"
# 本家からの自動アップデートは無効（M-2・セキュリティ方針）。
MANIFEST_URL = ""
WORKER_PUBLIC_URL = "https://line-harness-kzn.bkobu-yd.workers.dev"
ADMIN_PUBLIC_URL = ""
LIFF_PUBLIC_URL = ""
LIFF_URL = ""
CF_ACCOUNT_ID = "01547b03881149dd0db10da0da6928c8"

# [Craval kzn] Phase 1 の安全設定（設計書 §4 / §5-1）
PUBLIC_PATHS_ALLOW = "/webhook,/api/auth/login,/api/auth/logout"
# 管理画面は line-harness-kzn-admin.pages.dev（別サイト）= SameSite=None Cookie。Safari 不可・Chrome 可。
# DNS 権限が取れたら lh-admin/lh-api.anami-pat.jp の同一サイト構成へ移す（ADMIN_ALLOW_CROSS_SITE を外す）。
ADMIN_ALLOW_CROSS_SITE = "true"
# 管理画面（apps/web・httpOnly Cookie 認証）を出す時は、Cookie ログイン用の2パスを許可リストに足し、
# ADMIN_ORIGIN（管理画面の origin）を設定する。推奨は anami-pat.jp 配下の同一サイト構成:
#   PUBLIC_PATHS_ALLOW = "/webhook,/api/auth/login,/api/auth/logout"
#   ADMIN_ORIGIN       = "https://lh-admin.anami-pat.jp"   # Pages カスタムドメイン
#   WORKER_URL(secret) = "https://lh-api.anami-pat.jp"     # Worker カスタムドメイン（同一サイト→SameSite=Lax）
# *.pages.dev ↔ *.workers.dev のままだとクロスサイトになり ADMIN_COOKIE_SAMESITE="None" と
# ADMIN_ALLOW_CROSS_SITE="true" が必要（サードパーティ Cookie 依存・Safari では動かない）。
INCOMING_IMAGE_STORE = "0"
WEBHOOK_INBOX = "1"
LINE_SEND_DISABLED = "1"
# Phase 1 はイベントバス（送信Webhook・スコア・自動化・automation_logs）と auto_replies を止める。Phase 3 で外す。
EVENT_BUS_DISABLED = "1"
LINE_MEDIA_STORE = "1"
# 返信予約枠: 一斉配信・ステップ配信・リマインダーは「LINE の残り通数 − 50」までしか使わない（受信箱からの 1:1 返信の枠を温存。無料200通運用）
LINE_REPLY_RESERVE = "50"
MIRROR_URL = "https://anami-pat.jp/api/line-harness-event"

# Secrets (要 `wrangler secret put ... -c wrangler.kzn.toml`・値は Bitwarden `line-harness-kzn`):
#   LINE_CHANNEL_SECRET            # きずなの Channel secret
#   LINE_CHANNEL_ACCESS_TOKEN      # きずなの Long-lived token
#   LINE_CHANNEL_ID                # きずな Messaging API Channel ID = 2009123769
#   API_KEY                        # 管理 API 用 Bearer（32byte hex）
#   ADMIN_API_KEY                  # /admin/update/* 用（PUBLIC_PATHS_ALLOW で閉じているが念のため設定）
#   WORKER_URL                     # https://line-harness-kzn.bkobu-yd.workers.dev
#   MIRROR_SECRET                  # きずな Pages の LINE_HARNESS_MIRROR_SECRET と同値。**必須**（未設定だと転送は保留＝mirrored=0 のまま溜まる）
# 設定しない: LINE_LOGIN_CHANNEL_ID / LINE_LOGIN_CHANNEL_SECRET / STRIPE_* / CF_API_TOKEN
# ADMIN_ORIGIN は secret（https://line-harness-kzn-admin.pages.dev）。ADMIN_COOKIE_SAMESITE は未設定（ALLOW_CROSS_SITE=true で None になる）
